<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>Gabinette MS v47 - Supabase Super Simple (Anti Gagal)</title>
<link rel="manifest" href="manifest.json"/>
<link rel="icon" href="favicon.ico"/>
<meta name="theme-color" content="#111827"/>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.7/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#172033;--muted:#697586;--line:#e6eaf0;--brand:#f97316;--brand2:#ea580c;--ok:#10b981;--supa:#3ecf8e}
*{box-sizing:border-box;font-family:ui-sans-system,-apple-system,Segoe UI,Roboto,Helvetica,Arial;}
body{margin:0;background:var(--bg);color:var(--ink);}
button,input,textarea{font:inherit} button{transition:.12s} button:active{transform:scale(.98)}
.wrap{max-width:520px;margin:0 auto;min-height:100vh;background:var(--bg);border-left:1px solid var(--line);border-right:1px solid var(--line);}
header{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.92);backdrop-filter:blur(16px);border-bottom:1px solid var(--line);padding:14px 18px;display:flex;align-items:center;gap:12px}
.logo{width:40px;height:40px;border-radius:12px;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:800}
h1{font-size:17px;margin:0}
.badge{font-size:10px;font-weight:800;padding:4px 10px;border-radius:999px;background:#e8f5e9;color:#2e7d32;border:1px solid #c8e6c9}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin:14px;box-shadow:0 5px 20px rgba(23,32,51,.045)}
.hero{background:linear-gradient(135deg,#172033,#263957);color:#fff;border-radius:22px;padding:20px;margin:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.vcard{border:1px solid var(--line);border-radius:16px;padding:12px;background:#fff;min-width:0}
.btn{min-height:42px;border-radius:13px;border:1px solid var(--line);background:#fff;font-weight:750;cursor:pointer;padding:0 12px}
.btn-dark{background:#172033;color:#fff;border-color:#172033}
.btn-brand{background:linear-gradient(90deg,var(--brand),var(--brand2));color:#fff;border:0}
.btn-danger{background:#fff1f2;color:#be123c;border:1px solid #fecdd3}
.btn-ok{background:var(--ok);color:#fff;border:0}
.btn-supa{background:var(--supa);color:#000;border:0;font-weight:800}
.input{width:100%;height:48px;border-radius:14px;border:1px solid var(--line);background:#f8fafc;padding:0 12px;font-weight:700;font-size:13px}
.textarea{width:100%;min-height:80px;border-radius:14px;border:1px solid var(--line);background:#f8fafc;padding:12px;font-size:11px;font-family:monospace}
.kembalian{font-size:12px;font-weight:800;padding:6px 10px;border-radius:999px}
.ok{background:#e8f5e9;color:#2e7d32}.bad{background:#ffefef;color:#b42318}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;background:rgba(255,255,255,.96);backdrop-filter:blur(16px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:8px}
.navbtn{height:54px;border-radius:14px;border:0;background:transparent;color:#8a7569;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10px;font-weight:800;cursor:pointer}
.navbtn.active{background:#172033;color:#fff}
table{width:100%;border-collapse:collapse;font-size:12px} th,td{padding:8px;border-bottom:1px solid #f6e8c8;text-align:left}
.dropzone{border:2px dashed #3ecf8e;background:#f0fdf4;border-radius:16px;padding:18px;text-align:center;cursor:pointer}
.db-dot{width:8px;height:8px;border-radius:999px;display:inline-block}
</style>
</head>
<body>
<div class="wrap">
<header><div class="logo">GB</div><div style="flex:1"><h1>GABINETTE MS v47</h1><div style="font-size:11px;color:var(--muted);font-weight:700">SUPABASE SIMPLE • ANTI GAGAL • PRODUKSI FIX</div></div><div class="badge" id="dbBadge">LOCAL</div></header>
<div id="content"></div><div style="height:84px"></div></div>
<nav>
<button class="navbtn active" data-tab="beranda">🏠<span>Utama</span></button>
<button class="navbtn" data-tab="jual">🛍️<span>Jual</span></button>
<button class="navbtn" data-tab="stock">📦<span>Stock</span></button>
<button class="navbtn" data-tab="bahan">🧾<span>Bahan</span></button>
<button class="navbtn" data-tab="rab">📊<span>RAB</span></button>
</nav>
<script>
const VARIANTS=[
{id:'CKL',name:'Cokelat',stock:7},
{id:'MTC',name:'Matcha',stock:4},
{id:'CKC',name:'Cookies & Cream',stock:9},
{id:'MTO',name:'Matcha Oreo',stock:8},
{id:'DBC',name:'Double Choco',stock:6},
{id:'STW',name:'Strawberry',stock:5},
{id:'STM',name:'Straw Matcha',stock:9}
];
const MODAL=1847117;
let cart={}; VARIANTS.forEach(v=>cart[v.id]=0); let uang=0; let tab='beranda';
let stock=[...VARIANTS.map(v=>({...v, price: v.id==='MTC'||v.id==='CKL'?9000:10000, hpp: v.id==='MTC'?5308.5:v.id==='CKL'?5674:v.id==='CKC'?5583:v.id==='DBC'?6626:v.id==='MTO'?5749.5:v.id==='STW'?5945:5775.1}))];
let bahan=[
{name:'Whipping Cream (stok lama)',qty:978,unit:'gr',note:'Stok lama',min:150},
{name:'Gabin',qty:84,unit:'pcs',note:'Stok awal',min:27},
{name:'Bubuk Matcha',qty:0,unit:'gr',note:'Belum dicatat',min:20},
{name:'Susu SKM',qty:0,unit:'gr',note:'Belum dicatat',min:100},
{name:'Bubuk Cokelat',qty:45,unit:'gr',note:'Stok awal',min:50},
{name:'Pewarna Cokelat',qty:0,unit:'ml',note:'Belum dicatat',min:5},
{name:'Perisa Coklat',qty:0,unit:'ml',note:'Belum dicatat',min:5},
{name:'Oreo',qty:0,unit:'gr',note:'Gram',min:30},
{name:'Chocho Chips',qty:0,unit:'gr',note:'Belum dicatat',min:30},
{name:'Strawberry',qty:0,unit:'gr',note:'Takaran pcs tidak tercantum',min:20},
{name:'Selai Strawberry',qty:0,unit:'gr',note:'Belum dicatat',min:30},
{name:'Gula Pasir',qty:0,unit:'gr',note:'Takaran pcs tidak tercantum',min:20},
{name:'Foil Aluminium',qty:540,unit:'cm',note:'27 pcs lagi',min:200},
{name:'Whipping Cream Haan',qty:0,unit:'gr',note:'25 g per loyang (9 pcs)',min:25},
{name:'Whipping Cream Whipking',qty:0,unit:'gr',note:'75 g per loyang (9 pcs)',min:75},
{name:'Whipping Cream KIS',qty:0,unit:'gr',note:'100 g per loyang (9 pcs)',min:100},
{name:'SKM Dairy',qty:0,unit:'gr',note:'Semua varian kecuali Chocolate & Double Choco',min:100},
{name:'SKM Bendera Kental Manis',qty:0,unit:'gr',note:'Untuk Chocolate & Double Choco',min:100}
];
const STORAGE_KEY='gabinette_ms_v29_data';
const SUPA_URL_KEY='gabinette_supabase_url';
const SUPA_KEY_KEY='gabinette_supabase_anon';
const DB_MODE_KEY='gabinette_db_mode_v47';
let stockEdits=[]; let productStockEdits=[]; let sales=[]; let purchases=[];
let recipes={
'MTC':{'0':22,'1':2,'2':1.11,'3':10},
'CKL':{'0':22,'1':2,'4':1.1,'3':10,'5':0.3,'6':0.3},
'CKC':{'0':22,'1':2,'7':5.9,'3':10},
'DBC':{'0':22,'1':2,'4':1.1,'3':10,'5':0.3,'6':0.3,'8':8.8},
'MTO':{'0':22,'1':2,'2':1.11,'3':10,'7':5.9},
'STW':{'0':22,'1':2,'10':11.1,'3':10},
'STM':{'0':22,'1':2,'9':0,'10':5.55,'3':10,'11':0,'2':0.55}
};
let recipeDraftVariant='MTC';
let dbMode=localStorage.getItem(DB_MODE_KEY)||'local';
let supabaseClient=null;
let isSyncing=false;
let lastSupaError='';

function localDateKey(d=new Date()){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function fmt(n){return Math.round(Number(n)||0).toLocaleString('id-ID')}
function getSupaConfig(){return {url: localStorage.getItem(SUPA_URL_KEY)||'', anon: localStorage.getItem(SUPA_KEY_KEY)||''}}
function saveSupaConfig(url, anon){localStorage.setItem(SUPA_URL_KEY, url.trim()); localStorage.setItem(SUPA_KEY_KEY, anon.trim());}
function updateDbBadge(text, mode){
  const el=document.getElementById('dbBadge'); if(!el) return;
  el.textContent=text;
  if(mode==='supabase'){el.style.background='#dcfce7'; el.style.color='#166534';}
  else if(mode==='local'){el.style.background='#fff1d6'; el.style.color='#92400e';}
  else{el.style.background='#ffefef'; el.style.color='#b42318';}
}
function initSupabase(){
  const cfg=getSupaConfig();
  if(!cfg.url || !cfg.anon){updateDbBadge('LOCAL','local'); return false;}
  if(!window.supabase){setTimeout(initSupabase,1000); return false;}
  try{
    supabaseClient=window.supabase.createClient(cfg.url, cfg.anon);
    updateDbBadge('SUPABASE ✓','supabase');
    return true;
  }catch(e){console.error(e); lastSupaError=e.message; updateDbBadge('ERROR','error'); return false;}
}
async function loadFromSupabase(){
  if(!supabaseClient) return false;
  try{
    const {data, error} = await supabaseClient.from('gabinette_data').select('*').eq('id','main').single();
    if(error){
      if(error.code==='PGRST116') return false;
      throw error;
    }
    if(data){
      if(data.stock) stock=data.stock;
      if(data.sales) sales=data.sales;
      if(data.bahan) bahan=data.bahan;
      if(data.recipes) recipes=data.recipes;
      if(data.product_stock_edits) productStockEdits=data.product_stock_edits;
      return true;
    }
  }catch(e){console.error(e); lastSupaError=e.message; throw e;}
  return false;
}
async function saveToSupabase(){
  if(dbMode!=='supabase' || !supabaseClient) return;
  if(isSyncing) return;
  isSyncing=true;
  try{
    const payload={id:'main', stock, sales, bahan, recipes, product_stock_edits:productStockEdits, updated_at:new Date().toISOString()};
    let {error} = await supabaseClient.from('gabinette_data').upsert(payload, {onConflict:'id'});
    if(error && error.message && error.message.includes('column') && error.message.includes('schema cache')){
      // retry without updated_at if column missing
      console.warn('Retrying without updated_at', error.message);
      const minimalPayload={id:'main', stock, sales, bahan, recipes, product_stock_edits:productStockEdits};
      const retry = await supabaseClient.from('gabinette_data').upsert(minimalPayload, {onConflict:'id'});
      error = retry.error;
    }
    if(error) throw error;
    updateDbBadge('SUPABASE ✓','supabase');
    lastSupaError='';
    const box=document.getElementById('supaErrorBox'); if(box) box.style.display='none';
  }catch(e){
    console.error(e);
    lastSupaError=e.message;
    let badge='SYNC GAGAL';
    const m=e.message.toLowerCase();
    if(m.includes('does not exist')||m.includes('42p01')) badge='TABEL BELUM ADA!';
    else if(m.includes('policy')||m.includes('42501')||m.includes('rls')) badge='BUKA RLS/POLICY!';
    else if(m.includes('api key')||m.includes('jwt')) badge='KEY SALAH!';
    updateDbBadge(badge,'error');
    const box=document.getElementById('supaErrorBox');
    const txt=document.getElementById('supaErrorText');
    if(box&&txt){
      box.style.display='block';
      txt.textContent='Error: '+e.message+'\n\nCopy SQL → SQL Editor → RUN';
    }
  }finally{isSyncing=false;}
}
function startRealtime(){
  if(dbMode!=='supabase' || !supabaseClient) return;
  try{
    supabaseClient.channel('gabinette_changes').on('postgres_changes', {event:'*', schema:'public', table:'gabinette_data', filter:'id=eq.main'}, payload=>{
      if(isSyncing) return;
      const data=payload.new;
      if(data){
        stock=data.stock||stock;
        sales=data.sales||sales;
        bahan=data.bahan||bahan;
        recipes=data.recipes||recipes;
        productStockEdits=data.product_stock_edits||productStockEdits;
        saveDataLocal();
        render();
      }
    }).subscribe();
  }catch(e){console.error(e)}
}
function loadSavedData(){
  try{
    const saved=JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}');
    if(Array.isArray(saved.stock)&&saved.stock.length) stock=saved.stock;
    if(Array.isArray(saved.sales)) sales=saved.sales;
    if(Array.isArray(saved.bahan)&&saved.bahan.length) bahan=saved.bahan.map(b=>({...b}));
    if(Array.isArray(saved.productStockEdits)) productStockEdits=saved.productStockEdits;
    if(saved.recipes) recipes=saved.recipes;
  }catch(e){}
}
function saveDataLocal(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify({stock,sales,bahan,purchases,recipes,stockEdits,productStockEdits}))}catch(e){}}
function saveData(){saveDataLocal(); if(dbMode==='supabase') saveToSupabase();}
async function switchDbMode(mode){
  dbMode=mode;
  localStorage.setItem(DB_MODE_KEY, mode);
  if(mode==='supabase'){
    const cfg=getSupaConfig();
    if(!cfg.url){alert('Isi dulu URL & Anon Key Supabase!'); dbMode='local'; localStorage.setItem(DB_MODE_KEY,'local'); updateDbBadge('LOCAL','local'); render(); return;}
    const ok=initSupabase();
    if(!ok){alert('Gagal init Supabase'); return;}
    try{
      await loadFromSupabase();
      startRealtime();
      await saveToSupabase();
      alert('SUPABASE AKTIF ✓ Anti hilang & sync semua HP!');
    }catch(e){
      alert('Gagal koneksi Supabase: '+e.message+'\n\nPastikan sudah RUN SQL di Supabase SQL Editor (klik COPY SQL di bawah)!');
    }
  }else{
    updateDbBadge('LOCAL','local');
    alert('Mode LOCAL. Data hanya di HP ini.');
  }
  render();
}
function todaySales(){const key=localDateKey();return sales.filter(s=>s.date===key)}
function sumSales(rows){return rows.reduce((a,s)=>({qty:a.qty+s.qty,omset:a.omset+s.omset,laba:a.laba+s.laba}),{qty:0,omset:0,laba:0})}
function bepStats(){const labaPenjualan=sales.reduce((t,s)=>t+Number(s.laba||0),0);const labaTerkumpul=1364117+labaPenjualan;const sisa=Math.max(0,MODAL-labaTerkumpul);const persen=MODAL>0?(labaTerkumpul/MODAL)*100:0;return {labaPenjualan,labaTerkumpul,sisa,persen,barPersen:Math.max(0,Math.min(100,persen))}}
function salesSummaryHTML(){
  const rows=todaySales(), t=sumSales(rows);
  return `<div class="card"><div style="display:flex;justify-content:space-between"><div><div style="font-size:17px;font-weight:850">Penjualan Hari Ini</div><div style="font-size:11px;color:var(--muted)">${new Date().toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</div></div><span style="font-size:11px;background:#ecfdf5;color:#047857;padding:6px 9px;border-radius:999px">${rows.length} trx</span></div><div class="grid3" style="margin-top:12px"><div class="vcard"><div style="font-size:10px;color:var(--muted)">OMZET</div><div style="font-weight:850">Rp ${fmt(t.omset)}</div></div><div class="vcard"><div style="font-size:10px;color:var(--muted)">LABA</div><div style="font-weight:850;color:#047857">Rp ${fmt(t.laba)}</div></div><div class="vcard"><div style="font-size:10px;color:var(--muted)">TERJUAL</div><div style="font-weight:850">${t.qty} pcs</div></div></div></div>`;
}
function historyHTML(){
  const rows=todaySales().slice().reverse();
  return `<div class="card"><div style="font-weight:850;margin-bottom:8px">Riwayat Hari Ini</div>${rows.length?rows.map(s=>`<div class="vcard" style="margin-bottom:8px"><div style="display:flex;justify-content:space-between"><b>${s.id}</b><span style="font-size:11px;color:var(--muted)">${s.time}</span></div><div style="font-size:12px;color:var(--muted)">${s.items.map(i=>`${i.name} × ${i.qty}`).join(' • ')}</div><div style="display:flex;justify-content:space-between"><span>${s.qty} pcs</span><b>Rp ${fmt(s.omset)}</b></div></div>`).join(''):'<div style="text-align:center;color:var(--muted);font-size:13px;padding:12px">Belum ada transaksi</div>'}</div>`;
}
function bahanHTML(){
  return `<div class="hero"><div style="font-weight:850;font-size:18px">Stok Bahan Baku</div><div style="font-size:12px;opacity:.8">${bahan.length} jenis bahan</div></div><div class="card">${bahan.map((b,i)=>`<div class="vcard" style="margin-bottom:8px"><div style="display:flex;justify-content:space-between"><div><div style="font-weight:800">${b.name}</div><div style="font-size:11px;color:var(--muted)">${b.note}</div></div><div style="text-align:right"><div style="font-weight:800">${b.qty} ${b.unit}</div></div></div><div class="grid2" style="margin-top:8px"><input id="bahanQty${i}" class="input" style="height:38px;padding-left:12px" type="number" value="${b.qty}"><button class="btn btn-dark" style="height:38px" onclick="simpanBahan(${i})">Simpan</button></div></div>`).join('')}</div>`;
}
function simpanBahan(i){const el=document.getElementById('bahanQty'+i);if(!el)return;bahan[i].qty=Number(el.value)||0;saveData();render();alert('Disimpan');}
function stockHTML(){
  const prodVariantId=window._prodVariantId||stock[0].id;
  const prodQty=window._prodQty||'';
  const prodRec=recipes[prodVariantId]||{};
  let preview='';
  if(Object.keys(prodRec).length&&Number(prodQty)>0){
    preview=Object.entries(prodRec).map(([idx,per])=>{
      const b=bahan[Number(idx)]; if(!b) return '';
      const need=Number(per)*Number(prodQty);
      return `<div style="display:flex;justify-content:space-between;font-size:11px;padding:5px 0"><span>${b.name} <b>${need.toFixed(1)} ${b.unit}</b></span><span>Sisa ${(Number(b.qty||0)-need).toFixed(1)}</span></div>`;
    }).join('');
  }
  return `<div class="hero"><div style="font-weight:850;font-size:18px">Stok Produk Jadi</div><div style="font-size:12px;opacity:.8">Total ${stock.reduce((a,v)=>a+v.stock,0)} pcs siap jual</div><div class="grid3" style="margin-top:12px">${stock.map(v=>`<div style="background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);border-radius:12px;padding:10px"><div style="font-size:10px;opacity:.8">${v.name}</div><div style="font-size:21px;font-weight:850">${v.stock}</div><div style="font-size:10px;opacity:.7">pcs</div></div>`).join('')}</div></div>
  <div class="card" style="border:2px solid #f97316;background:linear-gradient(180deg,#fff,#fff8e7)">
    <div style="font-size:18px;font-weight:850">🏭 Produksi Produk - FIX v47</div>
    <div style="font-size:12px;color:var(--muted);margin:6px 0 14px">Bahan otomatis berkurang</div>
    <select id="prodVariant" class="input" style="height:44px;margin:6px 0 10px" onchange="window._prodVariantId=this.value;render();">${stock.map(v=>`<option value="${v.id}" ${v.id===prodVariantId?'selected':''}>${v.name} - Stok ${v.stock}</option>`).join('')}</select>
    <div class="grid2"><div><label style="font-size:12px;font-weight:800">Jumlah (pcs)</label><input id="prodQty" class="input" style="margin:6px 0 10px" type="number" value="${prodQty}" placeholder="9" oninput="window._prodQty=this.value;updateProdPreview()"></div><div><label style="font-size:12px;font-weight:800">Tanggal</label><input id="prodDate" class="input" style="margin:6px 0 10px" type="date" value="${localDateKey()}"></div></div>
    <div id="prodPreview" style="background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px">${preview||'<div style="font-size:11px;color:var(--muted)">Masukkan jumlah produksi</div>'}</div>
    <button class="btn btn-brand" style="width:100%;height:52px" onclick="prosesProduksi()">🚀 Produksi Sekarang</button>
  </div>
  <div class="card"><div style="font-size:18px;font-weight:850">Koreksi Stok Manual</div>${stock.map((v,i)=>`<div class="vcard" style="margin-bottom:10px"><div style="display:flex;justify-content:space-between"><div><div style="font-weight:800">${v.name}</div><div style="font-size:11px;color:var(--muted)">${v.id}</div></div><div style="text-align:right"><div style="font-weight:850;font-size:18px">${v.stock} pcs</div></div></div><div class="grid2" style="margin-top:8px"><input id="editProductStock${i}" class="input" style="height:38px;padding-left:12px" type="number" value="${v.stock}"><button class="btn" onclick="simpanEditStokProduk(${i})">Simpan</button></div></div>`).join('')}</div>
  <div class="card"><div style="font-size:18px;font-weight:850">Resep per Varian</div><select id="recipeVariant" class="input" style="height:44px;margin:12px 0" onchange="ubahVarianResep(this.value)">${stock.map(v=>`<option value="${v.id}" ${v.id===recipeDraftVariant?'selected':''}>${v.name}</option>`).join('')}</select>
  ${bahan.map((b,i)=>`<div class="grid2" style="margin-bottom:8px"><div style="font-size:12px;font-weight:700">${b.name}</div><div><input class="input recipe-qty" style="height:42px" type="number" data-material="${i}" value="${(recipes[recipeDraftVariant]||{})[i]??''}"></div></div>`).join('')}
  <button class="btn btn-brand" style="width:100%;margin-top:8px" onclick="simpanResep()">Simpan Resep</button></div>`;
}
function simpanEditStokProduk(index){
  const item=stock[index];
  const input=document.getElementById('editProductStock'+index);
  if(!item||!input)return;
  const next=Number(input.value); if(!Number.isFinite(next)||next<0)return;
  const before=item.stock;
  if(next>before){const rec=recipes[item.id]||{}; Object.entries(rec).forEach(([mIdx,per])=>{const b=bahan[Number(mIdx)]; if(b) b.qty=Math.max(0,Number(b.qty||0)-Number(per)*(next-before));});}
  item.stock=next;
  productStockEdits.push({id:'KOREKSI-'+Date.now(),productId:item.id,name:item.name,before,after:next,note:'Koreksi',date:localDateKey(new Date()),time:new Date().toLocaleTimeString('id-ID')});
  saveData();render();
}
function updateProdPreview(){
  const qtyEl=document.getElementById('prodQty');
  const varEl=document.getElementById('prodVariant');
  const prevEl=document.getElementById('prodPreview');
  if(!qtyEl||!varEl||!prevEl) return;
  window._prodQty=qtyEl.value; window._prodVariantId=varEl.value;
  const prodRec=recipes[window._prodVariantId]||{};
  const q=Number(window._prodQty||0);
  if(!Object.keys(prodRec).length){prevEl.innerHTML='Resep belum diatur!';return;}
  if(q<=0){prevEl.innerHTML='Masukkan jumlah';return;}
  let html='<div style="font-weight:800;font-size:12px;margin-bottom:6px">Bahan untuk '+q+' pcs:</div>';
  Object.entries(prodRec).forEach(([idx,per])=>{const b=bahan[Number(idx)]; if(!b) return; html+=`<div style="display:flex;justify-content:space-between;font-size:11px;padding:4px 0"><span>${b.name} ${ (Number(per)*q).toFixed(1)} ${b.unit}</span></div>`;});
  prevEl.innerHTML=html;
}
function prosesProduksi(){
  const vEl=document.getElementById('prodVariant');
  const qEl=document.getElementById('prodQty');
  const dEl=document.getElementById('prodDate');
  if(!vEl||!qEl)return;
  const qty=Number(qEl.value); if(!qty||qty<=0)return alert('Isi jumlah');
  const idx=stock.findIndex(v=>v.id===vEl.value);
  const item=stock[idx];
  const rec=recipes[vEl.value]||{};
  Object.entries(rec).forEach(([mIdx,per])=>{const b=bahan[Number(mIdx)]; if(b) b.qty=Math.max(0,Number(b.qty||0)-Number(per)*qty);});
  const before=item.stock; item.stock+=qty;
  const now=dEl&&dEl.value?new Date(dEl.value):new Date();
  productStockEdits.push({id:'PRODUKSI-'+Date.now(),productId:item.id,name:item.name,before,after:item.stock,note:'Produksi +'+qty+' pcs',date:localDateKey(now),time:now.toLocaleTimeString('id-ID')});
  saveData();window._prodQty='';render();alert('Produksi berhasil! '+before+' → '+item.stock);
}

function jual(){

  if(uang<omset)return alert('Uang bayar kurang');
  const laba=stock.reduce((a,v)=>a+(cart[v.id]||0)*(v.price-v.hpp),0);
  const items=stock.filter(v=>(cart[v.id]||0)>0).map(v=>({id:v.id,name:v.name,qty:cart[v.id],price:v.price,hpp:v.hpp}));

}

function handleExcelUpload(e){
  const file=e.target.files[0]; if(!file) return;
  if(typeof XLSX==='undefined'){alert('Library Excel belum loaded');return;}
  const reader=new FileReader();
  reader.onload=function(ev){
    try{
      const data=new Uint8Array(ev.target.result);
      const wb=XLSX.read(data,{type:'array'});
      const ws=wb.Sheets['Rekap Penjualan']||wb.Sheets[wb.SheetNames[0]];
      const json=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
      let headerRow=-1;
      for(let i=0;i<Math.min(json.length,15);i++){const row=json[i].join(' ').toLowerCase(); if(row.includes('chocolate')||row.includes('tanggal')){headerRow=i;break;}}
      if(headerRow<0){alert('Format tidak dikenali');return;}
      const headers=json[headerRow].map(h=>String(h).toLowerCase().trim());
      const idxTanggal=headers.findIndex(h=>h.includes('tanggal'));
      const idxChoc=headers.findIndex(h=>h.includes('chocolate')||h.includes('cokelat'));
      const idxMatcha=headers.findIndex(h=>h==='matcha');
      const idxCkc=headers.findIndex(h=>h.includes('cookies'));
      const idxMto=headers.findIndex(h=>h.includes('matcha oreo'));
      const idxDbc=headers.findIndex(h=>h.includes('double'));
      const idxStw=headers.findIndex(h=>h.includes('strawberry')&&!h.includes('matcha'));
      const idxStm=headers.findIndex(h=>h.includes('matcha strawberry')||h.includes('straw matcha'));
      const idxTotal=headers.findIndex(h=>h==='total'&&!h.includes('omset'));
      const idxOmset=headers.findIndex(h=>h.includes('total omset')||h==='total omset');
      const idxLaba=headers.findIndex(h=>h.includes('total laba'));
      let imported=0;
      for(let r=headerRow+1;r<json.length;r++){
        const row=json[r]; if(!row||row.length===0) continue;
        let tglRaw=row[idxTanggal]; if(!tglRaw) continue;
        if(String(tglRaw).toLowerCase().includes('stock')||String(tglRaw).toLowerCase().includes('tester')||String(tglRaw).toLowerCase().includes('batch')) continue;
        let tanggal='';
        if(tglRaw instanceof Date){tanggal=localDateKey(tglRaw);}
        else if(typeof tglRaw==='number'){const dt=XLSX.SSF.parse_date_code(tglRaw); if(dt) tanggal=`${dt.y}-${String(dt.m).padStart(2,'0')}-${String(dt.d).padStart(2,'0')}`;}
        else{
          const s=String(tglRaw).trim();
          const bulanMap={jan:'01',feb:'02',mar:'03',apr:'04',mei:'05',may:'05',jun:'06',jul:'07',aug:'08',agu:'08',sep:'09',oct:'10',okt:'10',nov:'11',dec:'12',des:'12'};
          const m=s.match(/(\d{1,2})\s+([A-Za-z]+)\s+(\d{4})/);
          if(m){const b=bulanMap[m[2].toLowerCase().substring(0,3)]||'01'; tanggal=`${m[3]}-${b}-${String(m[1]).padStart(2,'0')}`;}
          else{const m2=s.match(/(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})/); if(m2) tanggal=`${m2[3]}-${String(m2[2]).padStart(2,'0')}-${String(m2[1]).padStart(2,'0')}`; else continue;}
        }
        const getQty=(idx)=>{if(idx<0) return 0; const v=row[idx]; const n=Number(String(v).replace(/[^0-9.-]/g,'')); return Number.isFinite(n)?Math.round(n):0;};
        const choc=getQty(idxChoc), m=getQty(idxMatcha), ckc=getQty(idxCkc), mto=getQty(idxMto), dbc=getQty(idxDbc), stw=getQty(idxStw), stm=getQty(idxStm);
        const total=getQty(idxTotal)|| (choc+m+ckc+mto+dbc+stw+stm);
        if(total===0) continue;
        let omset=row[idxOmset]||0; if(typeof omset==='string') omset=Number(omset.replace(/[^0-9]/g,''))||0;
        let laba=row[idxLaba]||0; if(typeof laba==='string') laba=Number(laba.replace(/[^0-9]/g,''))||0;
        if(omset===0) omset=total*9000; if(laba===0) laba=Math.round(total*3000);
        const items=[];
        if(choc>0) items.push({id:'CKL',name:'Cokelat',qty:choc,price:9000,hpp:5674});
        if(m>0) items.push({id:'MTC',name:'Matcha',qty:m,price:9000,hpp:5308.5});
        if(ckc>0) items.push({id:'CKC',name:'Cookies & Cream',qty:ckc,price:10000,hpp:5583});
        if(mto>0) items.push({id:'MTO',name:'Matcha Oreo',qty:mto,price:10000,hpp:5749.5});
        if(dbc>0) items.push({id:'DBC',name:'Double Choco',qty:dbc,price:10000,hpp:6626});
        if(stw>0) items.push({id:'STW',name:'Strawberry',qty:stw,price:10000,hpp:5945});
        if(stm>0) items.push({id:'STM',name:'Straw Matcha',qty:stm,price:10000,hpp:5775.1});
        const sale={id:'EXCEL-'+tanggal+'-'+r,date:tanggal,time:'12:00',qty:total,omset:omset,laba:laba,paid:omset,change:0,items};
        const existing=sales.findIndex(s=>s.date===tanggal&&s.id.startsWith('EXCEL-'));
        if(existing>=0) sales[existing]=sale; else sales.push(sale);
        imported++;
      }
      saveData();render();alert('Upload Excel berhasil! '+imported+' hari terimport');
    }catch(err){alert('Gagal baca Excel: '+err.message)}
  };
  reader.readAsArrayBuffer(file);
  e.target.value='';
}
